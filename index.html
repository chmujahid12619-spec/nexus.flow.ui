<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusFlow AI & Data Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Main Card Container -->
    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 mt-6">
        <!-- Header -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
                NexusFlow AI & Data Hub
            </h1>
            <p class="text-sm text-slate-400 mt-1">Autonomous Micro-SaaS Processing Node</p>
        </div>

        <!-- Input Form -->
        <div class="space-y-4">
            <div>
                <label for="queryInput" class="block text-sm font-medium text-slate-300 mb-2">Enter Workflow Query / Task</label>
                <input type="text" id="queryInput" placeholder="e.g., Analyze market trends & automation..." 
                    class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 text-slate-100 placeholder-slate-500 transition">
            </div>

            <div class="flex gap-3">
                <button onclick="runWorkflow()" id="submitBtn"
                    class="flex-1 py-3 px-4 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-xl shadow-lg transition duration-200 transform active:scale-95">
                    Run Workflow
                </button>
                <button onclick="resetForm()" 
                    class="px-4 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl transition duration-200">
                    Reset
                </button>
            </div>
        </div>

        <!-- Result Box -->
        <div id="resultContainer" class="mt-6 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-sm font-semibold text-cyan-400 uppercase tracking-wider">Execution Output</h2>
                <button onclick="copyOutput()" id="copyBtn" class="text-xs text-slate-400 hover:text-cyan-400 transition">Copy JSON</button>
            </div>
            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 font-mono text-xs text-emerald-400 overflow-x-auto max-h-60">
                <pre id="outputJson">// Waiting for response...</pre>
            </div>
        </div>

        <!-- Contact & Support Section -->
        <div class="mt-8 pt-6 border-t border-slate-800 text-center">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Direct Support & Inquiries</h3>
            <div class="flex flex-col sm:flex-row justify-center items-center gap-4 text-sm">
                <!-- Email -->
                <a href="mailto:chmujahid12619@gmail.com" class="flex items-center gap-2 text-slate-300 hover:text-cyan-400 transition bg-slate-950 px-4 py-2 rounded-lg border border-slate-800">
                    <span>📧</span> chmujahid12619@gmail.com
                </a>
                <!-- WhatsApp Business -->
                <a href="https://wa.me/923269447550" target="_blank" class="flex items-center gap-2 text-slate-300 hover:text-emerald-400 transition bg-slate-950 px-4 py-2 rounded-lg border border-slate-800">
                    <span>💬</span> +92 326 9447550
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="my-4 text-xs text-slate-500 text-center">
        Powered by Android Termux & Flask Micro-SaaS Architecture | Ch Mujahid Hussain
    </footer>

    <!-- Script -->
    <script>
        async function runWorkflow() {
            const queryInput = document.getElementById('queryInput').value.trim();
            const outputJson = document.getElementById('outputJson');
            const resultContainer = document.getElementById('resultContainer');
            const submitBtn = document.getElementById('submitBtn');

            if (!queryInput) {
                alert('براہ کرم کچھ نہ کچھ ٹائپ کریں!');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = 'Processing...';
            resultContainer.classList.remove('hidden');
            outputJson.innerText = 'Connecting to server...';

            try {
                // آپ کا لائیو ٹنل یو آر ایل
                const apiUrl = 'http://bore.pub:38645/api/v1/process';

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query: queryInput })
                });

                const data = await response.json();
                outputJson.innerText = JSON.stringify(data, null, 2);

            } catch (error) {
                outputJson.innerText = 'Error: ' + error.message + '\n\n(Note: Ensure your Termux server & bore tunnel are active!)';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Run Workflow';
            }
        }

        function resetForm() {
            document.getElementById('queryInput').value = '';
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('outputJson').innerText = '// Waiting for response...';
        }

        function copyOutput() {
            const text = document.getElementById('outputJson').innerText;
            navigator.clipboard.writeText(text);
            const copyBtn = document.getElementById('copyBtn');
            copyBtn.innerText = 'Copied!';
            setTimeout(() => copyBtn.innerText = 'Copy JSON', 2000);
        }
    </script>
</body>
</html>
